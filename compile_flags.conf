# compile_flags.conf
# Declarative KEY=VALUE format.
# Do not source this file.
# Do not eval this file.
# Do not execute this file as shell code.

BUILD_TYPE=Release
BUILD_DIR=build
BUILD_TARGETS=llama-server
BUILD_JOBS=auto

LINUX_GENERATOR=Ninja
WINDOWS_GENERATOR=Ninja

COMMON_CMAKE_OPTIONS=-DLLAMA_CURL=ON
CUDA_CMAKE_OPTIONS=-DGGML_CUDA=ON
NOCUDA_CMAKE_OPTIONS=-DGGML_CUDA=OFF

CUDA_VERSION=12.6.3

LINUX_APT_PACKAGES=cmake ninja-build build-essential curl
WINDOWS_CHOCO_PACKAGES=cmake ninja

ARTIFACT_PREFIX=llama-server

RUN_TESTS=false
LINUX_TEST_COMMAND=ctest --test-dir build --output-on-failure
WINDOWS_TEST_COMMAND=ctest --test-dir build --output-on-failure

# Per-target compile switches.
# TRUE = compile this target.
# FALSE = skip this target successfully.

CUDALINUX_COMPILE=TRUE
CUDAWIN_COMPILE=FALSE
NOCUDALINUX_COMPILE=TRUE
NOCUDAWIN_COMPILE=FALSE
